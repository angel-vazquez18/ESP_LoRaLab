<div id="r7-enclosure-viewer">
  <div class="viz-controls" role="group" aria-label="Enclosure view">
    <button class="btn" type="button" data-mode="assembled" aria-pressed="true">Assembled</button>
    <button class="btn" type="button" data-mode="exploded" aria-pressed="false">Exploded</button>
    <button class="btn" type="button" data-mode="cutaway" aria-pressed="false">Cutaway</button>
  </div>
  <div class="r7-stage">
    <canvas role="img" aria-label="Interactive R7 enclosure with internal speaker mount, project PCB, battery and antenna" aria-describedby="r7-gestures">R7 enclosure-mounted speaker, populated carrier, battery bay and SMA mount.</canvas>
    <svg id="r7-dimension-overlay" class="r7-dimensions text-small" role="img" aria-label="Nominal assembled fit dimensions in millimetres"><g id="r7-dimension-lines"></g></svg>
    <div id="r7-dimension-labels" aria-label="Clearance close-ups"></div>
    <div class="r7-loading text-small" role="status">Loading R7 geometry…</div>
  </div>
  <div class="text-small" id="r7-gestures">Drag to rotate · Scroll or pinch to zoom · Click a dimension for a close-up</div>
  <div class="viz-controls">
    <button class="btn" type="button" data-inspection="speaker_mount">Speaker mount</button>
    <button class="btn" type="button" data-inspection="sma_mount">SMA mount</button>
    <button class="btn" type="button" data-inspection="coax_route">Coax route</button>
    <button class="btn" type="button" data-inspection="microphone_path">Microphone path</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">Inspect
      <select class="form-select" id="r7-part"><option value="all">Complete assembly</option></select>
    </label>
    <label class="form-label">Shell
      <select class="form-select" id="r7-shell"><option value="solid">Solid</option><option value="transparent">Transparent</option><option value="hidden">Hidden</option></select>
    </label>
    <label class="form-check"><input class="form-check-input" id="r7-part-visible" type="checkbox" checked disabled><span class="form-check-label">Selected part visible</span></label>
  </div>
  <div class="text-small r7-detail" id="r7-detail" aria-live="polite"></div>
  <div class="viz-controls">
    <label class="form-label">Fit dimensions
      <select class="form-select" id="r7-dimensions"><option value="all">Key clearances</option><option value="battery">Battery clearances</option><option value="pcb">PCB to lid</option><option value="oled">OLED gap</option><option value="off">Off</option></select>
    </label>
    <span id="r7-overview-wrap" hidden><button class="btn" id="r7-overview" type="button">Back to overview</button></span>
  </div>
  <div class="text-small" id="r7-dimension-note" aria-live="polite"></div>
  <details>
    <summary>Camera controls</summary>
    <div class="r7-camera">
      <label class="form-label">Rotation <output class="tabular-nums" id="r7-yaw-value">40°</output><input class="form-range" id="r7-yaw" type="range" min="-180" max="180" value="40" step="1"></label>
      <label class="form-label">Tilt <output class="tabular-nums" id="r7-pitch-value">35°</output><input class="form-range" id="r7-pitch" type="range" min="-85" max="85" value="35" step="1"></label>
      <label class="form-label">Zoom <output class="tabular-nums" id="r7-zoom-value">1.0×</output><input class="form-range" id="r7-zoom" type="range" min="0.5" max="5" value="1" step="0.05"></label>
    </div>
  </details>
  <div class="text-small">__R7_SOURCE_LABEL__ + project component models · Speaker, battery, hardware and cables are fit references</div>
  <div class="text-destructive" id="r7-error" role="alert" hidden></div>
</div>
<style>
  #r7-enclosure-viewer{display:flex;flex-direction:column;gap:calc(var(--font-size-base)*.75);color:var(--foreground)}
  #r7-enclosure-viewer .r7-stage{position:relative}
  #r7-enclosure-viewer canvas{display:block;width:100%;height:clamp(360px,67vw,500px);touch-action:none;cursor:grab}
  #r7-enclosure-viewer canvas[data-dragging="true"]{cursor:grabbing}
  #r7-enclosure-viewer .r7-loading{position:absolute;inset:45% 0 auto;text-align:center;pointer-events:none}
  #r7-enclosure-viewer .r7-camera{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--font-size-base)*1);padding-top:calc(var(--font-size-base)*.5)}
  #r7-enclosure-viewer .r7-detail{min-height:calc(var(--font-size-base)*2.5)}
  #r7-enclosure-viewer .r7-dimensions{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
  #r7-enclosure-viewer .r7-dim-line{fill:none;stroke:var(--viz-series-1);stroke-width:1.25;vector-effect:non-scaling-stroke}
  #r7-enclosure-viewer .r7-dim-witness{fill:none;stroke:var(--foreground);stroke-width:1;stroke-dasharray:3 3;opacity:.65;vector-effect:non-scaling-stroke}
  #r7-enclosure-viewer .r7-dim-head{fill:var(--viz-series-1);stroke:none}
  #r7-enclosure-viewer .r7-dim-dot{fill:var(--viz-series-1);stroke:var(--background);stroke-width:1}
  #r7-enclosure-viewer .r7-dim-text{fill:var(--foreground);stroke:var(--background);stroke-width:4;paint-order:stroke;stroke-linejoin:round;font-weight:500}
  #r7-enclosure-viewer #r7-dimension-labels{position:absolute;inset:0;pointer-events:none}
  #r7-enclosure-viewer .r7-label-position{position:absolute;pointer-events:auto}
  @media(max-width:450px){#r7-enclosure-viewer .r7-camera{grid-template-columns:1fr}}
</style>

    canvas.addEventListener('wheel',e=>{e.preventDefault();cancelMotion();state.zoom=clamp(state.zoom*Math.exp(-clamp(e.deltaY,-500,500)*.0015),.5,5);requestDraw();clearTimeout(saveTimer);saveTimer=setTimeout(save,180);},{passive:false});
    root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{leaveFocus();state.mode=b.dataset.mode;sync();requestDraw();save();}));
    controls.part.addEventListener('change',()=>{state.selected=controls.part.value;sync();requestDraw();save();});
    controls.shell.addEventListener('change',()=>{state.shell=controls.shell.value;sync();requestDraw();save();});
    dimensionSelect.addEventListener('change',()=>{const value=dimensionSelect.value;leaveFocus();state.dimensions=value;sync();requestDraw();save();});
    controls.visible.addEventListener('change',()=>{state.hidden=state.hidden.filter(x=>x!==state.selected);if(!controls.visible.checked&&state.selected!=='all')state.hidden.push(state.selected);sync();requestDraw();save();});
    for(const key of ['yaw','pitch','zoom']){controls[key].addEventListener('input',()=>{const value=Number(controls[key].value);cancelMotion();state[key]=value;sync();requestDraw();});controls[key].addEventListener('change',save);}
    canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();ready=false;error.hidden=false;error.textContent='The 3D graphics context was interrupted. Reopen the view to restore it.';});
    new ResizeObserver(requestDraw).observe(canvas);
    new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
    ready=true;theme();sync();draw();root.querySelector('.r7-loading').hidden=true;root.dataset.ready='true';root.dataset.meshCount=meshes.length;root.dataset.triangleCount=meshes.reduce((n,m)=>n+m.count/3,0);
  }catch(e){error.hidden=false;error.textContent='Unable to display the model: '+e.message;root.querySelector('.r7-loading').hidden=true;root.dataset.ready='error';console.error(e);}
  function requestDraw(){}
})();
</script>
