[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lora-testbed"
version = "0.1.0"
description = "Local host testbed for a two-node ESP-IDF LoRa laboratory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pyserial>=3.5,<4",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
lora-testbed = "lora_testbed.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_testbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

