[platformio]
default_envs = heltec_v4_com6, heltec_v4_com7

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

upload_speed = 921600

board_build.partitions = huge_app.csv

; Remove two stale framework paths only when exporting IDE configuration.
; Inherited by mic_only, speaker_only and serial_only; normal build flags are unaffected.
extra_scripts = post:tools/filter_ide_includes.py

; Make <project-root>/include available while compiling files in lib/.
; Retain legacy I2S during hardware bring-up. Suppress only its two known
; ESP-IDF header deprecation notices; keep all other compiler warnings enabled.
build_flags =
    -I$PROJECT_DIR/include
    -DCONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -DCONFIG_ADC_SUPPRESS_DEPRECATE_WARN=1

; Same source and pins; use these builds to isolate peripherals electrically.
[env:mic_only]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAUDIO_ENABLE_SPEAKER=0

[env:speaker_only]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAUDIO_ENABLE_MIC=0

[env:serial_only]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAUDIO_ENABLE_MIC=0
    -DAUDIO_ENABLE_SPEAKER=0

; Heltec WiFi LoRa 32 V4.3, ESP32-S3R2, 16 MB flash / 2 MB quad PSRAM.
; Rev B wiring: MIC 4/6/38; amplifier 40/41/47, SD 48; PTT disabled.
; USB Serial/JTAG retains the chip's USB serial number across firmware changes.
[env:heltec_v4_r2]
extends = env:esp32dev
board = heltec_wifi_lora_32_V4
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
build_flags =
    ${env:esp32dev.build_flags}
    -DAUDIO_BOARD_HELTEC_V4=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; COM assignments were verified against the unique hardware MACs on 2026-11-16.
; Windows may assign different ports if USB connections change; verify before upload.
[env:heltec_v4_com6]
extends = env:heltec_v4_r2
upload_port = COM6
monitor_port = COM6
build_flags =
    ${env:heltec_v4_r2.build_flags}
    -DBENCH_NODE_ID=6

[env:heltec_v4_com7]
extends = env:heltec_v4_r2
upload_port = COM7
monitor_port = COM7
build_flags =
    ${env:heltec_v4_r2.build_flags}
    -DBENCH_NODE_ID=7
