[platformio]
default_envs = heltec_crypto_com6, heltec_crypto_com7

; Isolated snapshot of the tested standard Heltec V4.3 / ESP32-S3R2 bench.
; Only the 20-trial PLAIN / AES-128-GCM bench is included. No application integration.
[env]
platform = espressif32@8.0.0
board = heltec_wifi_lora_32_V4
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters =
    esp32_exception_decoder
    time
extra_scripts = post:tools/filter_ide_includes.py
build_src_filter = -<*> +<lora_crypto_bench.cpp>
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
    jgromes/RadioLib@7.6.0
build_flags =
    -I$PROJECT_DIR/include
    -DCONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -DCONFIG_ADC_SUPPRESS_DEPRECATE_WARN=1
    -DAUDIO_BOARD_HELTEC_V4=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLORA_INTEGRITY_BENCH=1
    -DAUDIO_ENABLE_MIC=0
    -DAUDIO_ENABLE_SPEAKER=0

; Port labels are historical assignments; verify USB identity before uploading.
[env:heltec_crypto_com6]
upload_port = COM6
monitor_port = COM6
build_flags =
    ${env.build_flags}
    -DLORA_BENCH_NODE_ID=6

[env:heltec_crypto_com7]
upload_port = COM7
monitor_port = COM7
build_flags =
    ${env.build_flags}
    -DLORA_BENCH_NODE_ID=7
